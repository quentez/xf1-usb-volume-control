name: Check official firmware

on:
  schedule:
    # Wake daily; the script checks every third UTC day across month boundaries.
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: official-firmware-check
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'quentez/xf1-usb-volume-control'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install .
      - name: Check Creative and report a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_firmware.py --notify quentez
